<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuizStreamPro — OBS Streaming Edition</title>

<!-- React + Babel loaded from CDN — no install needed -->
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="babel.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: #07070E; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  input[type=range]  { accent-color: #00E5FF; width: 100%; cursor: pointer; }
  input[type=color]  { cursor: pointer; }
  input[type=checkbox] { accent-color: #00E5FF; cursor: pointer; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: #0A0A14; }
  ::-webkit-scrollbar-thumb { background: #1A1A2E; border-radius: 3px; }
  .chip:hover        { filter: brightness(1.15); }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-muted:hover   { background: #141428 !important; color: #888 !important; }
  select { font-family: inherit; }
  @keyframes qIn {
    from { opacity:0; transform:translateY(-18px) scale(0.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes bIn {
    from { opacity:0; transform:translateY(14px) scale(0.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes timerPulse {
    0%,100% { transform:scale(1); }
    50%     { transform:scale(1.1); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── BUILT-IN QUESTIONS ──────────────────────────────────────────────────────

  {q:"Which country invented pizza?",a:"Italy",t:"Culture"},

  {q:"What is the capital of Japan?",a:"Tokyo",t:"Geography"},

  {q:"Which animal is known as the ship of the desert?",a:"Camel",t:"Nature"},

].map((q, i) => ({ ...q, id: i + 1 }));

const TOPICS = [
  "General Knowledge","Science","History","Geography",
  "Sports","Entertainment","Technology","Nature",
  "Math","Culture","Literature","Business"
];

// ── HELPERS ──────────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

function beep(freq = 880, dur = 0.09, vol = 0.28) {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
    setTimeout(() => ctx.close(), 500);
  } catch(e) {}
}

function revealChime() {
  beep(1047, 0.12, 0.35);
  setTimeout(() => beep(1319, 0.1, 0.25), 80);
  setTimeout(() => beep(1568, 0.18, 0.3), 160);
}

// ── SUB-COMPONENTS ───────────────────────────────────────────────────────────
function SectionLabel({ children }) {
  return (
    <div style={{
      fontSize:9, letterSpacing:4, color:"#1E1E38",
      marginBottom:10, textTransform:"uppercase",
      paddingBottom:6, borderBottom:"1px solid #0F0F1E",
    }}>{children}</div>
  );
}

function CtrlBtn({ onClick, label, color }) {
  return (
    <button onClick={onClick} style={{
      padding:"5px 13px", borderRadius:5, cursor:"pointer",
      background: color ? color+"18" : "#0C0C1C",
      color: color || "#3A3A58",
      border:`1px solid ${color ? color+"33" : "#111120"}`,
      fontSize:11, fontWeight: color ? 700 : 400,
      transition:"all 0.15s", whiteSpace:"nowrap",
    }}>{label}</button>
  );
}

function SettingsPanel({ cfg, set, voices }) {
  const Lbl = ({ children }) => (
    <div style={{fontSize:8,letterSpacing:3,color:"#252540",marginBottom:7,textTransform:"uppercase"}}>
      {children}
    </div>
  );
  const ColorRow = ({ label, k }) => (
    <div style={{marginBottom:18}}>
      <Lbl>{label}</Lbl>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <input type="color" value={cfg[k]} onChange={e => set(k, e.target.value)}
          style={{width:40,height:30,borderRadius:4,border:"1px solid #141428",background:"none",padding:0}}/>
        <span style={{fontSize:10,color:"#2A2A50",fontFamily:"monospace"}}>{cfg[k]}</span>
      </div>
    </div>
  );
  const RangeRow = ({ label, k, min, max, step=1, unit="" }) => (
    <div style={{marginBottom:18}}>
      <Lbl>{label}: {cfg[k]}{unit}</Lbl>
      <input type="range" min={min} max={max} step={step} value={cfg[k]}
        onChange={e => set(k, +e.target.value)}/>
    </div>
  );
  return (
    <div style={{fontSize:12}}>
      <div style={{fontSize:13,fontWeight:700,color:"#888",marginBottom:20}}>Display Settings</div>
      <ColorRow label="Background"    k="bg"/>
      <ColorRow label="Question Text" k="qColor"/>
      <ColorRow label="Answer Text"   k="aColor"/>
      <ColorRow label="Accent"        k="accent"/>
      <RangeRow label="Timer"         k="timerSec" min={3}   max={15}  unit="s"/>
      <RangeRow label="Question Size" k="qSize"    min={20}  max={60}  unit="px"/>
      <RangeRow label="Answer Size"   k="aSize"    min={16}  max={50}  unit="px"/>
      <RangeRow label="Voice Speed"   k="speed"    min={0.5} max={2.0} step={0.1} unit="x"/>
      <RangeRow label="Hold Answer"   k="hold"     min={500} max={6000} step={500} unit="ms"/>
      <RangeRow label="Between Qs"    k="gap"      min={500} max={3000} step={250} unit="ms"/>
      {voices.length > 0 && (
        <div style={{marginBottom:18}}>
          <Lbl>VOICE</Lbl>
          <select value={cfg.voice} onChange={e => set("voice", e.target.value)}
            style={{
              width:"100%",background:"#0C0C1C",color:"#666",
              border:"1px solid #141428",borderRadius:6,
              padding:"7px 10px",fontSize:11,appearance:"none",
            }}>
            <option value="">System Default</option>
            {voices.map(v => <option key={v.name} value={v.name}>{v.name} ({v.lang})</option>)}
          </select>
        </div>
      )}
      <label style={{
        display:"flex",gap:8,alignItems:"center",color:"#555",
        cursor:"pointer",fontSize:11,padding:"10px 0",borderTop:"1px solid #0F0F1E",
      }}>
        <input type="checkbox" checked={cfg.chroma} onChange={e => set("chroma", e.target.checked)}/>
        Green screen (chroma key for OBS)
      </label>
    </div>
  );
}

function ObsGuide() {
  const steps = [
    ["1","Click ▶ Start Quiz","#00E5FF"],
    ["2","Click 📡 OBS MODE at bottom","#00E5FF"],
    ["3","OBS → Sources → + → Browser Source","#FFD600"],
    ["4","Paste this file path or URL into OBS","#FFD600"],
    ["5","Width: 1920   Height: 1080","#FFD600"],
    ["6","Custom FPS: 30 fps","#69FF47"],
    ["7","Check: Shutdown when not visible","#69FF47"],

  ];

      {steps.map(([n,text,c]) => (

          <div style={{
            minWidth:22,height:22,borderRadius:"50%",flexShrink:0,
            background:c+"16",border:`1px solid ${c}28`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:9,color:c,fontWeight:700,marginTop:1,

        </div>
      ))}
      <div style={{
        marginTop:20,padding:"11px 13px",
        background:"#00E5FF0C",border:"1px solid #00E5FF20",
        borderRadius:7,color:"#00E5FF88",lineHeight:1.65,fontSize:11,
      }}>
        🔊 OBS Browser Source captures TTS audio automatically.
      </div>
      <div style={{
        marginTop:9,padding:"11px 13px",
        background:"#FF40810C",border:"1px solid #FF408120",
        borderRadius:7,color:"#FF408188",lineHeight:1.65,fontSize:11,
      }}>
        💡 Enable green screen in Settings → use OBS Chroma Key filter to overlay quiz on gameplay or webcam.
      </div>
    </div>

}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage]           = useState("home");
  const [questions, setQuestions] = useState(BUILTIN);
  const [qIndex, setQIndex]       = useState(0);
  const [phase, setPhase]         = useState("idle");
  const [timerVal, setTimerVal]   = useState(5);
  const [answerOn, setAnswerOn]   = useState(false);
  const [paused, setPaused]       = useState(false);
  const [obsMode, setObsMode]     = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [genStatus, setGenStatus] = useState("");
  const [selTopics, setSelTopics] = useState(["General Knowledge","Science","History"]);
  const [qCount, setQCount]       = useState(50);
  const [voices, setVoices]       = useState([]);
  const [qKey, setQKey]           = useState(0);
  const [apiKey, setApiKey]       = useState(localStorage.getItem("qsp_apikey")||"");
  const [showApiInput, setShowApiInput] = useState(false);

  const [cfg, setCfg] = useState(() => {
    try { return JSON.parse(localStorage.getItem("qsp_cfg")) || {}; } catch(e) { return {}; }
  });
  const DEFAULT_CFG = {
    bg:"#080B14", qColor:"#FFFFFF", aColor:"#FFD600", accent:"#00E5FF",
    timerSec:5, qSize:40, aSize:32, speed:0.9, voice:"", hold:2000, gap:1000, chroma:false,
  };
  const C = { ...DEFAULT_CFG, ...cfg };

  const set = (k, v) => setCfg(c => {
    const n = { ...c, [k]: v };
    localStorage.setItem("qsp_cfg", JSON.stringify(n));
    return n;
  });

  const runRef   = useRef(false);
  const pauseRef = useRef(false);
  const genRef   = useRef(0);
  const idxRef   = useRef(0);
  const qRef     = useRef(BUILTIN);
  const cfgRef   = useRef(C);

  useEffect(() => { cfgRef.current = C; }, [cfg]);
  useEffect(() => { qRef.current = questions; }, [questions]);

  // Load TTS voices
  useEffect(() => {
    const load = () => { const v = speechSynthesis.getVoices(); if(v.length) setVoices(v); };
    load();
    speechSynthesis.addEventListener("voiceschanged", load);
    return () => speechSynthesis.removeEventListener("voiceschanged", load);
  }, []);

  // ── TTS ────────────────────────────────────────────────────────────────────
  const speak = text => new Promise(res => {
    if (!window.speechSynthesis) { sleep(1200).then(res); return; }
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate  = cfgRef.current.speed;
    utt.pitch = 1.0;
    const v = speechSynthesis.getVoices().find(v => v.name === cfgRef.current.voice);
    if (v) utt.voice = v;
    utt.onend = res; utt.onerror = res;
    speechSynthesis.speak(utt);
  });

  // ── COUNTDOWN ──────────────────────────────────────────────────────────────
  const countdown = async (n, myGen) => {
    for (let i = n; i >= 0; i--) {
      if (genRef.current !== myGen) return;
      while (pauseRef.current && genRef.current === myGen) await sleep(100);
      setTimerVal(i);
      if (i > 0) {
        beep(i===1?1200:i===2?1050:880, 0.1, 0.22);
        await sleep(1000);
      }
    }
  };

  // ── QUIZ LOOP ───────────────────────────────────────────────────────────────
  const quizLoop = async () => {
    const myGen = ++genRef.current;
    runRef.current = true;
    while (runRef.current && genRef.current === myGen) {
      while (pauseRef.current && genRef.current === myGen) await sleep(100);
      if (genRef.current !== myGen) break;
      const qs = qRef.current;
      if (idxRef.current >= qs.length) { idxRef.current = 0; setQIndex(0); }
      const q = qs[idxRef.current];
      setAnswerOn(false);
      setQKey(k => k+1);
      setPhase("reading");
      await speak(q.q);
      if (genRef.current !== myGen) break;
      setPhase("timer");
      await countdown(cfgRef.current.timerSec, myGen);
      if (genRef.current !== myGen) break;
      setPhase("revealing");
      revealChime();
      setAnswerOn(true);
      await sleep(800);
      if (genRef.current !== myGen) break;
      await speak("The answer is " + q.a);
      if (genRef.current !== myGen) break;
      setPhase("holding");
      await sleep(cfgRef.current.hold);
      if (genRef.current !== myGen) break;
      setPhase("transitioning");
      setAnswerOn(false);
      await sleep(cfgRef.current.gap);
      if (genRef.current !== myGen) break;
      idxRef.current++;
      setQIndex(idxRef.current);
    }
    setPhase("idle");
  };

  // ── CONTROLS ────────────────────────────────────────────────────────────────
  const startQuiz = () => {
    idxRef.current = 0; setQIndex(0);
    setAnswerOn(false); setPaused(false); pauseRef.current = false;
    setPage("quiz");
    setTimeout(quizLoop, 400);
  };
  const stopQuiz = () => {
    genRef.current++; runRef.current = false; pauseRef.current = false;
    speechSynthesis.cancel(); setPaused(false); setObsMode(false); setPage("home");
  };
  const togglePause = () => {
    pauseRef.current = !pauseRef.current;
    setPaused(pauseRef.current);
    pauseRef.current ? speechSynthesis.pause() : speechSynthesis.resume();
  };
  const skip = () => {
    speechSynthesis.cancel(); setAnswerOn(false);
    const next = Math.min(idxRef.current+1, qRef.current.length-1);
    idxRef.current = next; setQIndex(next); quizLoop();
  };

  // ── AI GENERATION ───────────────────────────────────────────────────────────
  const generate = async () => {
    if (!selTopics.length) { setGenStatus("⚠ Select at least one topic"); return; }
    const key = apiKey.trim();
    if (!key) { setShowApiInput(true); setGenStatus("⚠ Enter your Anthropic API key first"); return; }
    setIsGenerating(true);
    setGenStatus("⟳ Generating questions with AI…");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": key,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-policy":"allow",
        },
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:4096,
          messages:[{
            role:"user",
            content:`Generate exactly ${qCount} short interesting trivia quiz questions about: ${selTopics.join(", ")}.
Return ONLY a valid JSON array, no markdown, no explanation:
[{"q":"question text","a":"short answer","t":"topic"}]
Rules:
- Each question under 12 words
- Each answer 1-5 words, short and precise
- Mix easy/medium/hard
- Fun and surprising questions only
- No duplicate questions
- Vary topics evenly across: ${selTopics.join(", ")}`
          }]
        })
      });
      const d = await res.json();
      if (d.error) throw new Error(d.error.message);
      let text = d.content[0].text.trim().replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(text);
      const qs = parsed.map((x,i) => ({...x, id:i+1}));
      setQuestions(qs); qRef.current = qs;
      setGenStatus(`✓ ${qs.length} questions ready!`);
    } catch(e) {
      setGenStatus("⚠ Error: " + (e.message||"Generation failed"));
    }
    setIsGenerating(false);
  };

  // ── TIMER VISUALS ───────────────────────────────────────────────────────────
  const R     = 42;
  const circ  = 2*Math.PI*R;
  const pct   = timerVal / (C.timerSec || 5);
  const tColor= pct > 0.6 ? "#69FF47" : pct > 0.3 ? "#FFD600" : "#FF3A3A";
  const curQ  = questions[Math.min(qIndex, questions.length-1)];

  // ──────────────────────────────────────────────────────────────────────────
  // HOME SCREEN
  // ──────────────────────────────────────────────────────────────────────────
  if (page === "home") return (
    <div style={{
      minHeight:"100vh", background:"#07070E",
      color:"#fff", fontFamily:"'Segoe UI', system-ui, sans-serif",
      display:"flex", flexDirection:"column",
    }}>

      {/* TOPBAR */}
      <div style={{
        padding:"16px 28px", borderBottom:"1px solid #0F0F1E",
        display:"flex", justifyContent:"space-between", alignItems:"center",
        background:"rgba(7,7,14,0.95)", position:"sticky", top:0, zIndex:50,
      }}>
        <div>
          <div style={{fontSize:20,fontWeight:900,letterSpacing:-0.5,lineHeight:1}}>
            <span style={{color:"#00E5FF"}}>QUIZ</span>
            <span style={{color:"#fff"}}>STREAM</span>
            <span style={{color:"#FF4081"}}>PRO</span>
          </div>
          <div style={{fontSize:8,letterSpacing:5,color:"#252540",marginTop:2}}>WEB · OBS STREAMING EDITION</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn-muted"
            onClick={() => setShowApiInput(s => !s)}
            style={{
              background:"#0C0C1C",border:"1px solid #141428",
              color:"#444",padding:"7px 14px",borderRadius:6,
              cursor:"pointer",fontSize:12,transition:"all 0.15s",
            }}>🔑 API Key</button>
          <button className="btn-muted"
            onClick={() => setShowSettings(s => !s)}
            style={{
              background: showSettings?"#0E0E28":"#0C0C1C",
              border:`1px solid ${showSettings?"#00E5FF44":"#141428"}`,
              color: showSettings?"#00E5FF":"#444",
              padding:"7px 16px",borderRadius:6,
              cursor:"pointer",fontSize:12,transition:"all 0.15s",
            }}>⚙ Settings</button>
        </div>
      </div>

      {/* API KEY INPUT (collapsible) */}
      {showApiInput && (
        <div style={{
          background:"#0A0A18",borderBottom:"1px solid #0F0F1E",
          padding:"14px 28px",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",
        }}>
          <span style={{fontSize:11,color:"#444",whiteSpace:"nowrap"}}>Anthropic API Key:</span>
          <input
            type="password"
            placeholder="sk-ant-api03-..."
            value={apiKey}
            onChange={e => { setApiKey(e.target.value); localStorage.setItem("qsp_apikey", e.target.value); }}
            style={{
              flex:1,minWidth:260,background:"#0C0C1C",color:"#888",
              border:"1px solid #141428",borderRadius:6,
              padding:"7px 12px",fontSize:12,outline:"none",
            }}
          />
          <a href="https://console.anthropic.com/" target="_blank" rel="noopener"
            style={{fontSize:11,color:"#00E5FF88",textDecoration:"none"}}>
            Get key →
          </a>
          <button onClick={() => setShowApiInput(false)}
            style={{background:"none",border:"none",color:"#333",cursor:"pointer",fontSize:14}}>✕</button>
        </div>
      )}

      {/* BODY */}
      <div style={{display:"flex",flex:1,minHeight:0}}>

        {/* LEFT */}
        <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>

          <SectionLabel>Select Topics</SectionLabel>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:28}}>
            {TOPICS.map(t => {
              const on = selTopics.includes(t);
              return (
                <button key={t} className="chip"
                  onClick={() => setSelTopics(p => on ? p.filter(x=>x!==t) : [...p,t])}
                  style={{
                    padding:"6px 14px",fontSize:12,cursor:"pointer",borderRadius:20,
                    background: on?"#00E5FF":"#0C0C1E",
                    color: on?"#000":"#555",
                    border:`1px solid ${on?"#00E5FF":"#141428"}`,
                    fontWeight: on?700:400,transition:"all 0.15s",
                  }}>{t}</button>
              );
            })}
          </div>

          <SectionLabel>Questions to Generate</SectionLabel>
          <div style={{display:"flex",gap:8,marginBottom:28,flexWrap:"wrap"}}>
            {[25,50,100,200,500,1000].map(n => (
              <button key={n} onClick={() => setQCount(n)}
                style={{
                  padding:"7px 16px",fontSize:12,cursor:"pointer",borderRadius:6,
                  background: qCount===n?"#FF4081":"#0C0C1E",
                  color: qCount===n?"#fff":"#555",
                  border:`1px solid ${qCount===n?"#FF408188":"#141428"}`,
                  fontWeight: qCount===n?700:400,transition:"all 0.15s",
                }}>{n}</button>
            ))}
          </div>

          <div style={{display:"flex",gap:12,marginBottom:14,flexWrap:"wrap"}}>
            <button className="btn-primary" onClick={generate} disabled={isGenerating}
              style={{
                padding:"11px 24px",
                background: isGenerating?"#111120":"linear-gradient(135deg,#0096C7,#0077B6)",
                color: isGenerating?"#444":"#fff",
                border:"none",borderRadius:8,
                cursor: isGenerating?"not-allowed":"pointer",
                fontSize:13,fontWeight:700,transition:"all 0.2s",
                boxShadow: isGenerating?"none":"0 4px 20px #0096C733",
              }}>
              {isGenerating ? "⟳  Generating…" : "⚡  Generate with AI"}
            </button>
            <button className="btn-primary" onClick={startQuiz}
              style={{
                padding:"11px 32px",
                background:"linear-gradient(135deg,#FF4081,#B71C60)",
                color:"#fff",border:"none",borderRadius:8,
                cursor:"pointer",fontSize:13,fontWeight:700,
                boxShadow:"0 4px 24px #FF408144",transition:"all 0.2s",
              }}>▶  Start Quiz</button>
          </div>

          {genStatus && (
            <div style={{
              fontSize:12,marginBottom:16,padding:"8px 12px",borderRadius:6,
              background: genStatus.startsWith("✓")?"#69FF4710":"#FF408110",
              border:`1px solid ${genStatus.startsWith("✓")?"#69FF4730":"#FF408130"}`,
              color: genStatus.startsWith("✓")?"#69FF47":"#FF8080",
            }}>{genStatus}</div>
          )}

          {/* Question preview */}
          <div style={{
            background:"#0A0A18",border:"1px solid #121220",
            borderRadius:10,padding:"16px 18px",
          }}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:12,alignItems:"center"}}>
              <span style={{fontSize:13,color:"#fff",fontWeight:600}}>
                📦 {questions.length} questions loaded
              </span>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {Array.from(new Set(questions.map(q=>q.t))).slice(0,5).map(t => (
                  <span key={t} style={{
                    fontSize:9,letterSpacing:1,padding:"2px 8px",
                    background:"#141428",borderRadius:10,color:"#444",
                  }}>{t}</span>
                ))}
              </div>
            </div>
            {questions.slice(0,5).map((q,i) => (
              <div key={i} style={{
                display:"flex",gap:10,padding:"8px 0",
                borderTop:"1px solid #0F0F1C",alignItems:"baseline",
              }}>
                <span style={{color:"#1E1E3E",fontSize:10,minWidth:22}}>Q{i+1}</span>
                <span style={{flex:1,fontSize:11,color:"#555",lineHeight:1.4}}>{q.q}</span>
                <span style={{fontSize:11,color:"#FFD60099",whiteSpace:"nowrap"}}>{q.a}</span>
              </div>
            ))}
            {questions.length > 5 && (
              <div style={{fontSize:10,color:"#222",paddingTop:8,textAlign:"center"}}>
                + {questions.length-5} more questions
              </div>
            )}
          </div>

        </div>{/* /LEFT */}

        {/* RIGHT */}
        <div style={{
          width:264,borderLeft:"1px solid #0F0F1E",
          padding:22,overflowY:"auto",background:"#070710",flexShrink:0,
        }}>
          {showSettings
            ? <SettingsPanel cfg={C} set={set} voices={voices}/>
            : <ObsGuide/>
          }
        </div>

      </div>{/* /BODY */}
    </div>
  );

  // ──────────────────────────────────────────────────────────────────────────
  // QUIZ SCREEN
  // ──────────────────────────────────────────────────────────────────────────
  return (
    <div style={{
      width:"100vw", height:"100vh",
      background: C.chroma ? "#00FF00" : C.bg,
      display:"flex", flexDirection:"column",
      position:"relative", overflow:"hidden", userSelect:"none",
    }}>

      {/* Ambient glow */}
      {!C.chroma && (
        <div style={{
          position:"absolute",inset:0,pointerEvents:"none",
          background:`radial-gradient(ellipse 60% 50% at 25% 40%,${C.accent}09 0%,transparent 70%),
                     radial-gradient(ellipse 50% 60% at 75% 65%,${C.aColor}08 0%,transparent 70%)`,
        }}/>
      )}

      {/* Countdown timer — top right */}
      {phase === "timer" && (
        <div style={{
          position:"absolute",top:22,right:22,zIndex:20,
          filter:`drop-shadow(0 0 16px ${tColor}55)`,
          animation: pct < 0.35 ? "timerPulse 0.5s ease-in-out infinite" : "none",
        }}>
          <svg width={96} height={96} viewBox="0 0 96 96">
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <circle cx={48} cy={48} r={R} fill="rgba(0,0,0,0.72)"/>
            <circle cx={48} cy={48} r={R} fill="none" stroke="#1A1A30" strokeWidth={4}/>
            <circle cx={48} cy={48} r={R} fill="none"
              stroke={tColor} strokeWidth={5}
              strokeDasharray={circ}
              strokeDashoffset={circ - circ*pct}
              strokeLinecap="round"
              transform="rotate(-90 48 48)"
              filter="url(#glow)"
              style={{transition:"stroke-dashoffset 0.9s linear, stroke 0.4s ease"}}
            />
            <text x={48} y={57} textAnchor="middle"
              fill={tColor} fontSize={30} fontWeight="bold"
              fontFamily="'Segoe UI', system-ui"
            >{timerVal}</text>
          </svg>
        </div>
      )}

      {/* Phase badge — hidden in OBS mode */}
      {!obsMode && (
        <div style={{
          position:"absolute",top:16,left:16,
          fontSize:9,letterSpacing:3,color:"#1A1A30",
          background:"rgba(0,0,0,0.5)",padding:"4px 10px",
          borderRadius:4,zIndex:10,
        }}>{phase.toUpperCase()}</div>
      )}

      {/* Main content */}
      <div style={{
        flex:1,display:"flex",flexDirection:"column",
        justifyContent:"center",alignItems:"center",
        padding: obsMode ? "48px 10% 56px" : "56px 10% 80px",
        gap:28,
      }}>

        {/* Question number + topic */}
        <div key={`badge-${qKey}`} style={{
          display:"flex",gap:14,alignItems:"center",
          animation:"bIn 0.45s ease-out",
        }}>
          <div style={{fontSize:11,letterSpacing:4,color:C.accent,opacity:0.55,fontWeight:600}}>
            QUESTION {Math.min(qIndex+1, questions.length)}{" "}
            <span style={{opacity:0.35}}>/ {questions.length}</span>
          </div>
          {curQ?.t && (
            <div style={{
              fontSize:9,letterSpacing:2,padding:"3px 11px",
              background:C.accent+"15",border:`1px solid ${C.accent}28`,
              borderRadius:20,color:C.accent,opacity:0.65,
            }}>{curQ.t.toUpperCase()}</div>
          )}
        </div>

        {/* Question text */}
        <div key={`q-${qKey}`} style={{
          fontSize: C.qSize,
          color: C.qColor,
          textAlign:"center",
          fontWeight:700,
          lineHeight:1.45,
          maxWidth:"84%",
          textShadow:"0 2px 32px rgba(0,0,0,0.9)",
          animation:"qIn 0.5s cubic-bezier(0.22,1,0.36,1)",
          letterSpacing:-0.3,
        }}>{curQ?.q}</div>

        {/* Answer reveal box */}
        <div key={`a-${qKey}`} style={{
          width:"78%",maxWidth:700,
          opacity: answerOn?1:0,
          transform:`translateY(${answerOn?0:28}px) scale(${answerOn?1:0.86})`,
          transition:"opacity 0.7s cubic-bezier(0.34,1.15,0.64,1), transform 0.7s cubic-bezier(0.34,1.15,0.64,1)",
          pointerEvents:"none",
        }}>
          <div style={{
            background:"rgba(4,4,16,0.82)",
            border:`2px solid ${C.accent}`,
            borderRadius:14,
            padding:"18px 36px",
            textAlign:"center",
            backdropFilter:"blur(16px)",
            boxShadow:`0 8px 48px ${C.accent}20, inset 0 1px 0 ${C.accent}15`,
          }}>
            <div style={{
              fontSize:9,letterSpacing:5,color:C.accent,
              opacity:0.5,marginBottom:10,textTransform:"uppercase",
            }}>The Answer</div>
            <div style={{
              fontSize: C.aSize,
              color: C.aColor,
              fontWeight:900,
              letterSpacing:-0.4,
              textShadow:`0 0 40px ${C.aColor}55`,
              lineHeight:1.25,
            }}>{curQ?.a}</div>
          </div>
        </div>

      </div>{/* /main content */}

      {/* Progress bar */}
      <div style={{
        position:"absolute",
        bottom: obsMode?0:50,
        left:0,right:0,height:2,background:"#0A0A16",
      }}>
        <div style={{
          height:"100%",
          width:`${((qIndex+1)/questions.length)*100}%`,
          background:`linear-gradient(90deg,${C.accent},${C.aColor})`,
          boxShadow:`0 0 6px ${C.accent}`,
          transition:"width 0.6s ease",
        }}/>
      </div>

      {/* Control bar — hidden in OBS mode */}
      {!obsMode && (
        <div style={{
          position:"absolute",bottom:0,left:0,right:0,height:50,
          background:"rgba(4,4,14,0.97)",
          borderTop:"1px solid #0F0F20",
          display:"flex",alignItems:"center",
          padding:"0 18px",gap:8,
        }}>
          <CtrlBtn onClick={togglePause} color={paused?"#69FF47":"#FF4081"}
            label={paused?"▶ Resume":"⏸ Pause"}/>
          <CtrlBtn onClick={skip} label="⏭ Skip"/>
          <CtrlBtn onClick={stopQuiz} label="■ Stop"/>
          <div style={{flex:1}}/>
          <div style={{
            fontSize:9,color:"#1A1A38",letterSpacing:2,
            padding:"3px 10px",background:"#0A0A18",
            borderRadius:4,border:"1px solid #111120",
          }}>Q {qIndex+1} / {questions.length} · {phase.toUpperCase()}</div>
          <CtrlBtn onClick={() => setObsMode(true)} color="#FF4081" label="📡 OBS MODE"/>
        </div>
      )}

      {/* Exit OBS mode — tiny */}
      {obsMode && (
        <button onClick={() => setObsMode(false)} style={{
          position:"absolute",bottom:8,right:8,
          background:"rgba(0,0,0,0.25)",border:"1px solid #151520",
          color:"#1A1A30",padding:"4px 10px",borderRadius:4,
          cursor:"pointer",fontSize:9,zIndex:100,
        }}>exit obs</button>
      )}

    </div>
  );
}

// ── MOUNT ────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
